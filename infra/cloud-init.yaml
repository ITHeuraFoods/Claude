#cloud-config
# ───────────────────────────────────────────────────────────────────────────────
# Aprovisionamiento del MCP hub de Heura. Portable entre proveedores:
#   · Hetzner Cloud → campo "Cloud config" al crear el servidor
#   · AWS EC2       → User data
#   · Azure         → custom_data / cloud-init
# Probado sobre Debian 12 y Ubuntu 24.04.
#
# ANTES DE USARLO, sustituye los tres marcadores:
#   MCP_HOSTNAME     → mcp.heurafoods.com
#   ENTRA_CLIENT_ID  → Application (client) ID del App Registration
#   ADMIN_SSH_KEY    → clave pública del equipo de IT
#
# El client secret NO se pone aquí (cloud-init queda legible en los metadatos de la
# instancia). Se copia a mano tras el primer arranque; ver infra/README.md, paso 4.
# ───────────────────────────────────────────────────────────────────────────────

package_update: true
package_upgrade: true

packages:
  - python3
  - python3-venv
  - python3-pip
  - git
  - ca-certificates
  - curl
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https
  - unattended-upgrades

users:
  - name: itadm
    groups: [sudo]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ADMIN_SSH_KEY
  # Usuario del servicio: sin shell y sin home. No inicia sesión nunca.
  - name: heura-mcp
    system: true
    shell: /usr/sbin/nologin
    lock_passwd: true

write_files:
  # Config no sensible del servicio.
  - path: /etc/heura-mcp/graph.env
    permissions: "0640"
    owner: root:heura-mcp
    content: |
      HEURA_ENTRA_CLIENT_ID=ENTRA_CLIENT_ID
      HEURA_ENTRA_TENANT_ID=4ff8acc2-4c1a-49ba-9344-9e47d370f6fc
      HEURA_PUBLIC_URL=https://MCP_HOSTNAME
      HEURA_STATE_DIR=/var/lib/heura-mcp
      HEURA_BIND_HOST=127.0.0.1
      HEURA_BIND_PORT=3002
      HEURA_ALLOWED_DOMAINS=heurafoods.com
      HEURA_BEARER_TTL_DAYS=90
      HEURA_LOG_LEVEL=INFO

  # Solo actualizaciones de seguridad automáticas, sin reinicios sorpresa.
  - path: /etc/apt/apt.conf.d/51heura-unattended
    permissions: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  # ── Caddy desde su repo oficial ─────────────────────────────────────────────
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key'
      | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt'
      > /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update
  - apt-get install -y caddy

  # ── Código y dependencias ───────────────────────────────────────────────────
  - git clone --depth 1 https://github.com/ITHeuraFoods/Claude.git /opt/heura-mcp
  - python3 -m venv /opt/heura-mcp/venv
  - /opt/heura-mcp/venv/bin/pip install --upgrade pip
  - /opt/heura-mcp/venv/bin/pip install -r /opt/heura-mcp/infra/requirements.txt
  - chown -R root:root /opt/heura-mcp

  # ── Reverse proxy ───────────────────────────────────────────────────────────
  - install -d -m 0755 -o caddy -g caddy /var/log/caddy
  - cp /opt/heura-mcp/infra/Caddyfile /etc/caddy/Caddyfile
  - sed -i "s/CADDY_SITE_PLACEHOLDER/MCP_HOSTNAME/" /etc/caddy/Caddyfile
  - systemctl enable --now caddy

  # ── Servicio MCP ────────────────────────────────────────────────────────────
  # Queda instalado y habilitado pero NO se arranca: sin el client secret el proceso
  # aborta con un FATAL claro. Se arranca en el paso 4 del README, tras copiarlo.
  - cp /opt/heura-mcp/infra/systemd/heura-graph-mcp.service
      /etc/systemd/system/heura-graph-mcp.service
  - systemctl daemon-reload
  - systemctl enable heura-graph-mcp

final_message: |
  Base lista. Falta el paso manual que no puede ir en cloud-init:
    1. Copia el client secret a /etc/heura-mcp/entra-client-secret (chmod 600, root:root)
    2. systemctl start heura-graph-mcp
    3. curl -s https://MCP_HOSTNAME/health
  Ver infra/README.md.
